name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
  gtk-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime
        run: sudo apt-get update && sudo apt-get install -y gir1.2-adw-1 python3-gi xvfb
      - name: Launch application
        run: timeout 3 xvfb-run -a /usr/bin/python3 src/app.py || test $? -eq 124
