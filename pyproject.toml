[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hyde-display-settings"
version = "0.2.0.dev0"
description = "Native display, idle, night-light, and screen-time settings for HyDE and Hyprland"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["hyde", "hyprland", "waybar", "gtk", "display-settings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
hyde-display-settings = "app:main"
hyde-display-settings-waybar = "waybar:main"
hyde-screen-time-tracker = "tracker:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["analytics", "app", "row_registry", "settings", "tracker", "waybar", "waybar_integration"]
